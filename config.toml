# =========================================================
# 站点基础配置
# =========================================================
baseURL = "https://YOUR-DOMAIN.vercel.app/"   # TODO: 部署后改为你的真实域名
title = "我的博客"
locale = "zh-cn"
defaultContentLanguage = "zh-cn"
hasCJKLanguage = true                          # 中文排版/字数统计必需

enableRobotsTXT = true
enableEmoji = true
enableGitInfo = false
buildDrafts = false

# =========================================================
# 主题（Hugo module 方式加载，无需 submodule）
# =========================================================
[module]
  [[module.imports]]
    path = "github.com/adityatelange/hugo-PaperMod"

# =========================================================
# 搜索：首页输出 JSON（PaperMod 搜索依赖）
# =========================================================
[outputs]
  home = ["HTML", "RSS", "JSON"]

# =========================================================
# Markdown 渲染
# =========================================================
[markup]
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

# =========================================================
# PaperMod 主题参数
# =========================================================
[params]
  env = "production"
  title = "我的博客"
  description = "记录技术、投资与生活"
  keywords = ["博客", "技术", "Hugo"]
  author = ""
  DateFormat = "2006-01-02"
  defaultTheme = "auto"          # auto = 跟随系统，可手动切换
  disableThemeToggle = false

  # 文章页元素
  ShowToc = true                 # 文章目录
  ShowReadingTime = true
  ShowWordCount = true
  ShowShareButtons = true        # 社交分享
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = true

  # 评论（giscus）
  comments = true

  # 搜索（fuse.js 参数）
  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 1

  # 首页横幅
  [params.homeInfoParams]
    Title = "👋 欢迎来到我的博客"
    Content = "这里记录我的技术学习、项目实践与思考。"

  # 社交图标
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/YOUR-USERNAME"   # TODO: 改为你的 GitHub
  [[params.socialIcons]]
    name = "email"
    url = "mailto:your@email.com"              # TODO: 改为你的邮箱

# =========================================================
# 菜单（顶部导航）
# =========================================================
[menu]
  [[menu.main]]
    identifier = "posts"
    name = "文章"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "search"
    name = "搜索"
    url = "/search/"
    weight = 20
  [[menu.main]]
    identifier = "archives"
    name = "归档"
    url = "/archives/"
    weight = 30
  [[menu.main]]
    identifier = "tags"
    name = "标签"
    url = "/tags/"
    weight = 40
  [[menu.main]]
    identifier = "about"
    name = "关于"
    url = "/about/"
    weight = 50
